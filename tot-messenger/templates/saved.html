<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Tot - Saved Messages</title>
<style>
  :root {
    --bg: #e5ddd5;
    --header-bg: #1f2c33;
    --header-text: #ffffff;
    --card-bg: #ffffff;
    --message-self: #eeffde;
    --message-other: #ffffff;
    --text-primary: #000000;
    --text-secondary: #707579;
    --input-bg: transparent;
    --input-border: transparent;
    --name-color: #0084ff;
    --time-color: #8d8e91;
    --divider: #e0e0e0;
    --selection-bg: rgba(0,132,255,0.15);
    --hover-bg: #f5f5f5;
    --glass-bg: rgba(128,128,128,0.08);
    --circle-color: rgba(0,0,0,0.05);
    --circle-hover: rgba(0,0,0,0.1);
    --circle-active: rgba(0,0,0,0.15);
    --center-bg: rgba(128,128,128,0.08);
    --center-border: rgba(128,128,128,0.15);
    --icon-color: #000000;
    --input-box-bg: rgba(255,255,255,0.92);
    --input-box-border: rgba(0,0,0,0.06);
    --input-box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }

  .dark-mode {
    --bg: #0e1621;
    --header-bg: #1f2c3c;
    --header-text: #ffffff;
    --card-bg: #17212b;
    --message-self: #2b5278;
    --message-other: #17212b;
    --text-primary: #ffffff;
    --text-secondary: #8d8e91;
    --input-bg: transparent;
    --input-border: transparent;
    --name-color: #5da8e8;
    --time-color: #6d6f72;
    --divider: #242f3d;
    --selection-bg: rgba(43,82,120,0.4);
    --hover-bg: #1f2c3c;
    --glass-bg: rgba(255,255,255,0.05);
    --circle-color: rgba(255,255,255,0.06);
    --circle-hover: rgba(255,255,255,0.1);
    --circle-active: rgba(255,255,255,0.15);
    --center-bg: rgba(255,255,255,0.05);
    --center-border: rgba(255,255,255,0.08);
    --icon-color: #ffffff;
    --input-box-bg: rgba(30,40,50,0.92);
    --input-box-border: rgba(255,255,255,0.06);
    --input-box-shadow: 0 2px 12px rgba(0,0,0,0.2);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; width: 100%; overflow: hidden; position: fixed; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    margin: 0; display: flex; flex-direction: column;
    background: var(--bg); color: var(--text-primary); direction: rtl;
  }

  .app-container { width: 100%; height: 100%; background: var(--bg); display: flex; flex-direction: column; overflow: hidden; }

  /* ========== HEADER ========== */
  .header {
    background: var(--bg);
    color: var(--header-text);
    padding: 8px 12px 4px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 60px;
    z-index: 100;
    flex-shrink: 0;
    border-bottom: none;
  }

  .header-left {
    display: flex;
    align-items: center;
    flex-shrink: 0;
  }

  .circle-btn {
    width: 40px;
    height: 40px;
    background: var(--circle-color);
    border: none;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    flex-shrink: 0;
    padding: 0;
  }

  .circle-btn:hover {
    background: var(--circle-hover);
  }

  .circle-btn:active {
    background: var(--circle-active);
    transform: scale(0.92);
  }

  .circle-btn svg {
    width: 22px;
    height: 22px;
    fill: var(--icon-color);
    stroke: var(--icon-color);
    stroke-width: 2;
  }

  .header-center {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    justify-content: center;
    min-width: 0;
    padding: 4px 14px;
    background: var(--center-bg);
    backdrop-filter: blur(10px);
    border-radius: 30px;
    margin: 0 6px;
    border: 1px solid var(--center-border);
  }

  .chat-avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #2a9eff;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .chat-avatar svg { width: 20px; height: 20px; fill: white; }

  .chat-info {
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .chat-name {
    font-size: 16px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.3;
    color: var(--text-primary);
  }

  .chat-status {
    font-size: 11px;
    opacity: 0.85;
    margin-top: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text-secondary);
  }

  .header-right {
    display: flex;
    align-items: center;
    flex-shrink: 0;
  }

  .header-more {
    background: var(--circle-color);
    border: none;
    cursor: pointer;
    width: 40px;
    height: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    border-radius: 50%;
    transition: background 0.2s, transform 0.15s;
    flex-shrink: 0;
    padding: 0;
  }

  .header-more:hover {
    background: var(--circle-hover);
  }

  .header-more:active {
    background: var(--circle-active);
    transform: scale(0.92);
  }

  .header-more span {
    width: 4px;
    height: 4px;
    background: var(--icon-color);
    border-radius: 50%;
    display: block;
  }

  .header-menu {
    position: fixed;
    top: 60px;
    right: 8px;
    background: var(--card-bg);
    border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.25);
    z-index: 200;
    min-width: 170px;
    overflow: hidden;
    display: none;
  }
  .header-menu.active { display: block; }
  .header-menu-item {
    padding: 13px 18px;
    cursor: pointer;
    font-size: 14px;
    color: var(--text-primary);
    transition: background 0.15s;
    text-align: right;
  }
  .header-menu-item:active { background: var(--hover-bg); }

  .header.hidden { display: none; }

  /* ========== SELECTION HEADER ========== */
  .selection-header {
    background: var(--header-bg); color: white; padding: 10px 16px;
    display: none; align-items: center; justify-content: space-between;
    min-height: 60px; z-index: 101; gap: 12px; flex-shrink: 0;
  }
  .selection-header.active { display: flex; }
  .close-select {
    background: none; border: none; color: white; font-size: 28px;
    cursor: pointer; width: 36px; height: 36px; display: flex; align-items: center;
    justify-content: center; border-radius: 50%;
  }
  .selection-count { font-size: 18px; font-weight: 700; flex: 1; text-align: center; }
  .delete-selected {
    background: none; border: none; color: white; font-size: 24px;
    cursor: pointer; width: 40px; height: 40px; display: flex; align-items: center;
    justify-content: center; border-radius: 50%; transition: background 0.2s;
  }

  /* ========== SEARCH BAR ========== */
  .search-bar {
    display: none; padding: 8px 10px; background: var(--input-bg);
    border-top: 1px solid var(--divider); gap: 8px; align-items: center;
    flex-shrink: 0; z-index: 50;
  }
  .search-bar.active { display: flex; }
  .search-bar input {
    flex: 1; padding: 10px 14px; border-radius: 22px;
    border: 1px solid var(--input-border); background: var(--card-bg);
    color: var(--text-primary); font-size: 16px; outline: none; text-align: right;
  }
  .search-nav { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--text-secondary); }
  .search-nav-btn {
    width: 32px; height: 32px; border: none; background: none;
    color: var(--text-secondary); cursor: pointer; display: flex;
    align-items: center; justify-content: center; border-radius: 50%;
    font-size: 18px;
  }
  .search-close {
    width: 32px; height: 32px; border: none; background: none;
    color: var(--text-secondary); cursor: pointer; display: flex;
    align-items: center; justify-content: center; border-radius: 50%;
    font-size: 20px;
  }

  /* ========== MESSAGES ========== */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 10px 15px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    -webkit-overflow-scrolling: touch;
    background-color: var(--bg);
    background-image: url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23000000' fill-opacity='0.03'%3E%3Cpath d='M20 20h4v4h-4zm10 0h4v4h-4zm-20 10h4v4h-4zm10 0h4v4h-4zm20-10h4v4h-4zm-30 20h4v4h-4zm10 0h4v4h-4zm20 0h4v4h-4zm10-20h4v4h-4zm-40 30h4v4h-4zm10 0h4v4h-4zm20 0h4v4h-4zm10 0h4v4h-4zM55 10l-3 3-3-3 3-3zm0 20l-3 3-3-3 3-3zm-30 20l-3 3-3-3 3-3zm20 0l-3 3-3-3 3-3zM15 55l3-3 3 3-3 3zm20 0l3-3 3 3-3 3zm20 0l3-3 3 3-3 3z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    background-size: 80px 80px;
  }
  .dark-mode #messages {
    background-image: url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.02'%3E%3Cpath d='M20 20h4v4h-4zm10 0h4v4h-4zm-20 10h4v4h-4zm10 0h4v4h-4zm20-10h4v4h-4zm-30 20h4v4h-4zm10 0h4v4h-4zm20 0h4v4h-4zm10-20h4v4h-4zm-40 30h4v4h-4zm10 0h4v4h-4zm20 0h4v4h-4zm10 0h4v4h-4zM55 10l-3 3-3-3 3-3zm0 20l-3 3-3-3 3-3zm-30 20l-3 3-3-3 3-3zm20 0l-3 3-3-3 3-3zM15 55l3-3 3 3-3 3zm20 0l3-3 3 3-3 3zm20 0l3-3 3 3-3 3z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    background-size: 80px 80px;
  }

  .message-row { display: flex; align-items: flex-end; gap: 8px; transition: background 0.15s; border-radius: 8px; padding: 2px 0; position: relative; z-index: 1; }
  .message-row.selected { background: var(--selection-bg); }
  .message-row.self { justify-content: flex-start; }
  .message-row.other { justify-content: flex-end; }
  .message-row.swiped { transform: translateX(60px); transition: transform 0.2s; }

  .msg-avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: white; flex-shrink: 0; align-self: flex-end; margin-bottom: 2px; overflow: hidden; }
  .msg-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .msg-avatar.c0 { background: #e57373; } .msg-avatar.c1 { background: #f06292; }
  .msg-avatar.c2 { background: #ba68c8; } .msg-avatar.c3 { background: #64b5f6; }
  .msg-avatar.c4 { background: #4db6ac; } .msg-avatar.c5 { background: #81c784; }
  .msg-avatar.c6 { background: #ffb74d; } .msg-avatar.c7 { background: #90a4ae; }
  .message-row.self .msg-avatar { order: 0; }
  .message-row.other .msg-avatar { order: 2; }

  .message { max-width: 75%; padding: 8px 12px; border-radius: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); background: var(--message-other); overflow: hidden; position: relative; }
  .message-row.self .message { background: var(--message-self); border-top-left-radius: 4px; border-top-right-radius: 12px; }
  .message-row.other .message { border-top-right-radius: 4px; border-top-left-radius: 12px; }

  .name { font-size: 13px; font-weight: 600; color: var(--name-color); margin-bottom: 4px; text-align: right; display: flex; align-items: center; gap: 4px; }
  .message-row.self .name { display: none; }
  .blue-tick { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; background: #2a9eff; border-radius: 50%; flex-shrink: 0; }
  .blue-tick svg { width: 10px; height: 10px; fill: white; }
  .text { font-size: 15px; word-wrap: break-word; line-height: 1.4; color: var(--text-primary); text-align: right; }
  .media-in-message { max-width: 260px; max-height: 280px; border-radius: 8px; margin-bottom: 4px; display: block; object-fit: cover; cursor: pointer; }
  .voice-in-message { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
  .voice-play-btn { width: 34px; height: 34px; border-radius: 50%; background: #0084ff; border: none; color: white; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .voice-duration { font-size: 11px; color: var(--time-color); flex-shrink: 0; min-width: 30px; }
  .file-card { display: flex; align-items: center; gap: 8px; padding: 6px 0; cursor: pointer; }
  .file-icon { width: 36px; height: 36px; border-radius: 8px; background: rgba(0,132,255,0.1); display: flex; align-items: center; justify-content: center; font-size: 14px; color: #0084ff; font-weight: 700; flex-shrink: 0; }
  .file-info { flex: 1; min-width: 0; }
  .file-name { font-size: 13px; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file-size { font-size: 11px; color: var(--text-secondary); }
  .time-row { display: flex; align-items: center; justify-content: flex-end; gap: 3px; margin-top: 2px; }
  .time { font-size: 11px; color: var(--time-color); }
  .ticks { display: inline-flex; align-items: center; }
  .ticks svg { width: 15px; height: 15px; }
  .edited-label { font-size: 10px; color: var(--time-color); margin-left: 4px; }

  .select-circle { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #aaa; display: none; align-items: center; justify-content: center; flex-shrink: 0; align-self: center; }
  .selection-mode .select-circle { display: flex; }
  .message-row.selected .select-circle { background: #0084ff; border-color: #0084ff; }
  .select-circle svg { width: 12px; height: 12px; fill: white; display: none; }
  .message-row.selected .select-circle svg { display: block; }

  /* ========== REPLY PREVIEW ========== */
  .reply-preview {
    display: none; padding: 8px 14px; background: var(--card-bg);
    border-right: 3px solid #0084ff; border-top: 1px solid var(--divider);
    font-size: 13px; align-items: center; gap: 10px; flex-shrink: 0;
  }
  .reply-preview.active { display: flex; }
  .reply-preview-content { flex: 1; }
  .reply-preview-sender { font-size: 11px; color: #0084ff; font-weight: 600; margin-bottom: 2px; }
  .reply-preview-text { font-size: 13px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .reply-preview-close { background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 18px; padding: 4px; }

  .message-reply {
    display: flex; align-items: center; gap: 4px; padding: 3px 6px;
    background: var(--glass-bg); border-radius: 8px; margin-bottom: 5px;
    font-size: 11px; border-right: 2px solid #0084ff;
  }

  /* ========== POPUPS ========== */
  .msg-action-popup {
    position: fixed; background: var(--card-bg); border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.25); z-index: 350;
    min-width: 190px; overflow: hidden; display: none;
  }
  .msg-action-popup.active { display: block; }
  .msg-action-item {
    padding: 12px 18px; cursor: pointer; font-size: 14px;
    color: var(--text-primary); transition: background 0.15s; text-align: right;
    display: flex; align-items: center; gap: 12px;
  }
  .msg-action-item svg { width: 20px; height: 20px; fill: var(--text-secondary); flex-shrink: 0; }

  .delete-modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6); z-index: 1000; display: none;
    align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
  }
  .delete-modal-overlay.active { display: flex; }
  .delete-modal-card {
    background: var(--card-bg); border-radius: 28px;
    width: 300px; overflow: hidden; animation: modalPop 0.2s ease;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
  }
  @keyframes modalPop {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }
  .delete-modal-header { padding: 20px 20px 8px; text-align: center; }
  .delete-modal-header svg { width: 48px; height: 48px; fill: #e53935; margin-bottom: 8px; }
  .delete-modal-header h3 { font-size: 18px; font-weight: 700; color: var(--text-primary); }
  .delete-modal-header p { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
  .delete-modal-actions { padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 10px; }
  .delete-modal-btn {
    width: 100%; padding: 14px; border-radius: 14px; font-size: 15px;
    font-weight: 600; cursor: pointer; transition: all 0.2s; text-align: center; border: none;
  }
  .delete-modal-btn.danger { background: #e53935; color: white; }
  .delete-modal-btn.danger:active { background: #c62828; }
  .delete-modal-btn.secondary { background: var(--glass-bg); color: var(--text-primary); border: 1px solid var(--divider); }
  .delete-modal-btn.cancel { background: transparent; color: var(--text-secondary); }

  .edit-modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6); z-index: 1050; display: none;
    align-items: center; justify-content: center;
  }
  .edit-modal-overlay.active { display: flex; }
  .edit-modal-card {
    background: var(--card-bg); border-radius: 24px;
    width: 300px; overflow: hidden; animation: modalPop 0.2s ease;
  }
  .edit-modal-header { padding: 20px; text-align: center; border-bottom: 1px solid var(--divider); }
  .edit-modal-header h3 { font-size: 18px; font-weight: 700; color: var(--text-primary); }
  .edit-modal-body { padding: 20px; }
  .edit-modal-body textarea {
    width: 100%; padding: 12px; border-radius: 12px;
    border: 1px solid var(--divider); background: var(--glass-bg);
    color: var(--text-primary); font-size: 15px; resize: none;
    font-family: inherit; outline: none; text-align: right;
  }
  .edit-modal-actions { display: flex; gap: 12px; padding: 0 20px 20px; }
  .edit-modal-btn {
    flex: 1; padding: 12px; border-radius: 12px; font-size: 14px;
    font-weight: 600; cursor: pointer; border: none;
  }
  .edit-modal-btn.save { background: #0084ff; color: white; }
  .edit-modal-btn.cancel { background: var(--glass-bg); color: var(--text-primary); }

  .forward-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5); z-index: 700; display: none;
    align-items: flex-end; justify-content: center;
  }
  .forward-overlay.active { display: flex; }
  .forward-sheet {
    background: var(--card-bg); border-radius: 20px 20px 0 0;
    width: 100%; max-height: 70vh; animation: slideUp 0.2s ease;
  }
  .forward-header { padding: 16px; border-bottom: 1px solid var(--divider); font-weight: 700; text-align: center; }
  .forward-list { padding: 8px 0; max-height: 50vh; overflow-y: auto; }
  .forward-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; transition: background 0.1s; }
  .forward-item:active { background: var(--hover-bg); }
  .forward-avatar { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #43e97b, #38f9d7); display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .forward-name { font-size: 16px; font-weight: 500; color: var(--text-primary); }
  .forward-close { width: 100%; padding: 14px; border: none; background: var(--hover-bg); cursor: pointer; color: var(--text-primary); }

  /* ========== EMOJI PANEL ========== */
  .emoji-panel {
    position: fixed; bottom: 70px; left: 0; right: 0;
    background: var(--card-bg); border-radius: 20px 20px 0 0;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.15); z-index: 600;
    max-height: 340px; display: flex; flex-direction: column;
    animation: slideUp 0.2s ease;
  }
  .emoji-categories {
    display: flex; border-bottom: 1px solid var(--divider);
    padding: 6px 12px; gap: 6px; overflow-x: auto;
    flex-shrink: 0; justify-content: space-around;
  }
  .emoji-cat { font-size: 20px; cursor: pointer; padding: 6px 8px; opacity: 0.6; transition: all 0.2s; border-radius: 20px; }
  .emoji-cat.active { opacity: 1; background: var(--glass-bg); }
  .emoji-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; padding: 12px; overflow-y: auto; max-height: 240px; }
  .emoji-item { font-size: 24px; cursor: pointer; text-align: center; padding: 4px; transition: transform 0.1s; border-radius: 8px; }
  .emoji-item:active { transform: scale(1.15); background: var(--hover-bg); }
  .emoji-header { display: flex; justify-content: space-between; padding: 8px 16px; border-bottom: 1px solid var(--divider); }
  .emoji-close { background: none; border: none; font-size: 18px; cursor: pointer; color: var(--text-secondary); padding: 4px 8px; }

  /* ========== VOICE RECORDING ========== */
  .voice-recording-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7); z-index: 1200; display: none;
    align-items: center; justify-content: center; flex-direction: column;
  }
  .voice-recording-overlay.active { display: flex; }
  .voice-recording-box { display: flex; flex-direction: column; align-items: center; gap: 20px; }
  .voice-timer { font-size: 40px; font-weight: 700; color: white; font-family: monospace; }
  .voice-actions { display: flex; gap: 30px; align-items: center; }
  .voice-action-btn {
    width: 56px; height: 56px; border-radius: 50%; border: none;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .voice-action-btn.cancel { background: #e53935; }
  .voice-action-btn.send { background: #0084ff; }
  .voice-action-btn svg { width: 24px; height: 24px; fill: white; }
  .voice-action-btn:active { transform: scale(0.9); }
  .voice-hint { font-size: 13px; color: rgba(255,255,255,0.6); text-align: center; }

  /* ========== UPLOAD ========== */
  .upload-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5); z-index: 1100; display: none;
    align-items: flex-end; justify-content: center;
  }
  .upload-overlay.active { display: flex; }
  .upload-sheet {
    background: var(--card-bg); border-radius: 16px 16px 0 0;
    width: 100%; max-height: 70vh; display: flex; flex-direction: column;
    animation: slideUp 0.3s ease; overflow: hidden;
  }
  @keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
  .upload-header { display:flex; align-items:center; justify-content:space-between; padding:14px 20px; border-bottom:1px solid var(--divider); }
  .upload-title { font-size:16px; font-weight:700; color:var(--text-primary); }
  .upload-close { background:none; border:none; color:var(--text-secondary); font-size:24px; cursor:pointer; padding:4px 8px; border-radius:8px; }
  .upload-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; padding:8px; overflow-y:auto; max-height:50vh; }
  .upload-item { position:relative; aspect-ratio:1; cursor:pointer; border-radius:6px; overflow:hidden; background:#000; }
  .upload-item img, .upload-item video { width:100%; height:100%; object-fit:cover; }
  .upload-select-circle { position:absolute; top:8px; right:8px; width:24px; height:24px; border-radius:50%; border:2px solid white; background:rgba(0,0,0,0.3); display:flex; align-items:center; justify-content:center; transition:all 0.2s; }
  .upload-item.selected .upload-select-circle { background:#0084ff; border-color:#0084ff; }
  .upload-select-circle svg { width:14px; height:14px; fill:white; display:none; }
  .upload-item.selected .upload-select-circle svg { display:block; }
  .upload-send-bar { display:flex; align-items:center; justify-content:space-between; padding:12px 20px; border-top:1px solid var(--divider); gap:12px; }
  .upload-send-count { font-size:14px; color:var(--text-primary); font-weight:600; }
  .upload-send-btn { padding:10px 28px; border:none; background:#0084ff; color:white; border-radius:24px; cursor:pointer; font-size:14px; font-weight:700; }
  .upload-send-btn:disabled { opacity:0.5; cursor:not-allowed; }

  /* ========== DYNAMIC ISLAND ========== */
  .dynamic-island {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.9); backdrop-filter: blur(20px);
    border-radius: 20px; padding: 8px 16px; display: flex;
    align-items: center; gap: 8px; z-index: 9999;
    font-size: 13px; font-weight: 600; color: white;
    opacity: 0; pointer-events: none; transition: all 0.3s;
    transform: translateX(-50%) translateY(-10px);
  }
  .dynamic-island.show { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
  .island-icon { width: 24px; height: 24px; border-radius: 50%; background: #0084ff; display: flex; align-items: center; justify-content: center; }
  .island-icon svg { width: 13px; height: 13px; fill: white; }

  /* ========== INPUT BOX ========== */
  .inputBox {
    display: flex;
    align-items: center;
    gap: 4px;
    margin: 0 12px 12px 12px;
    padding: 4px 6px;
    background: var(--input-box-bg);
    border-radius: 28px;
    border: 1px solid var(--input-box-border);
    box-shadow: var(--input-box-shadow);
    backdrop-filter: blur(10px);
    flex-shrink: 0;
    direction: ltr;
    position: relative;
    z-index: 10;
  }

  .inputBox .icon-btn {
    width: 38px;
    height: 38px;
    background: transparent;
    border: none;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.2s, transform 0.15s;
    padding: 0;
  }

  .inputBox .icon-btn:hover {
    background: var(--circle-hover);
  }

  .inputBox .icon-btn:active {
    background: var(--circle-active);
    transform: scale(0.9);
  }

  .inputBox .icon-btn svg {
    width: 22px;
    height: 22px;
    fill: var(--text-secondary);
    transition: fill 0.2s;
  }

  .inputBox .icon-btn:hover svg {
    fill: var(--text-primary);
  }

  #msg {
    flex: 1;
    padding: 10px 8px;
    background: transparent;
    border: none;
    color: var(--text-primary);
    font-size: 16px;
    outline: none;
    text-align: right;
    resize: none;
    min-height: 40px;
    max-height: 120px;
    line-height: 1.4;
    overflow-y: auto;
    -webkit-appearance: none;
    font-family: inherit;
  }

  #msg::placeholder {
    color: var(--text-secondary);
  }

  .send-btn {
    width: 40px;
    height: 40px;
    border: none;
    color: white;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    padding: 0;
    transition: background 0.2s, transform 0.15s;
    box-shadow: 0 2px 8px rgba(0,132,255,0.3);
  }

  .send-btn.mic { background: #0084ff; }
  .send-btn.send { background: #0084ff; }
  .send-btn:hover { transform: scale(1.05); }
  .send-btn:active { transform: scale(0.92); opacity: 0.85; }
  
  .mic-icon, .send-icon { width: 20px; height: 20px; fill: white; }

  .sticker-btn { order: 0; }
  #msg { order: 1; }
  .attach-btn { order: 2; }
  .send-btn { order: 3; }

  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 10px; }
  .dark-mode #messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); }
  input[type="file"] { display: none; }
</style>
</head>

<div class="app-container">

    <div class="msg-action-item" onclick="msgActionCopy()"><svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>Copy</div>
    <div class="msg-action-item" onclick="msgActionSelect()"><svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z"/></svg>Select</div>
    <div class="msg-action-item" onclick="msgActionForward()"><svg viewBox="0 0 24 24"><path d="M3 13h12l-4 4 1.5 1.5L19 12l-6.5-6.5L11 7l4 4H3v2z"/><path d="M21 3v18h2V3h-2z"/></svg>Forward</div>
    <div class="msg-action-item" onclick="msgActionEdit()"><svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>Edit</div>
    <div class="msg-action-item" id="msgActionSave" onclick="msgActionSave()" style="display:none"><svg viewBox="0 0 24 24"><path d="M19 12v7H5v-7H3v7c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-7h-2zm-6 .67l2.59-2.58L17 11.5l-5 5-5-5 1.41-1.41L11 12.67V3h2v9.67z"/></svg>Save</div>
  </div>

  <!-- ========== DELETE MODAL ========== -->
  <div class="delete-modal-overlay" id="deleteModalOverlay">
    <div class="delete-modal-card">

        <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>

    </div>

  <!-- ========== EDIT MODAL ========== -->

      <div class="edit-modal-header"><h3>Edit Message</h3></div>

        <textarea id="editTextarea" rows="3"></textarea>
      </div>
      <div class="edit-modal-actions">
        <button class="edit-modal-btn cancel" onclick="closeEditModal()">Cancel</button>

</div>

var currentEmojiCat = 'smileys';

// ========== EMOJI FUNCTIONS ==========
function toggleEmojiPanel(){
  if(emojiPanel.style.display === 'none'){
    renderEmojis('smileys');
    emojiPanel.style.display = 'flex';
  } else {
    emojiPanel.style.display = 'none';
  }
}
function closeEmojiPanel(){ emojiPanel.style.display = 'none'; }
function renderEmojis(cat){
  currentEmojiCat = cat;
  emojiGrid.innerHTML = '';
  emojiData[cat].forEach(function(emoji){
    var div = document.createElement('div');
    div.className = 'emoji-item';
    div.textContent = emoji;
    div.onclick = function(){ insertEmoji(emoji); };
    emojiGrid.appendChild(div);
  });
  document.querySelectorAll('.emoji-cat').forEach(function(c){
    c.classList.remove('active');
    if(c.getAttribute('data-cat') === cat) c.classList.add('active');
  });
}
function insertEmoji(emoji){
  textarea.value += emoji;
  textarea.focus();
  updateSendButton();
  closeEmojiPanel();
}
document.querySelectorAll('.emoji-cat').forEach(function(cat){
  cat.addEventListener('click', function(){
    renderEmojis(this.getAttribute('data-cat'));
  });
});

// ========== THEME FUNCTIONS ==========
function toggleDarkMode(){
  var isDark = document.body.classList.contains('dark-mode');
  if(isDark){ 
    document.body.classList.remove('dark-mode'); 
    localStorage.setItem('theme','light'); 
  } else { 
    document.body.classList.add('dark-mode'); 
    localStorage.setItem('theme','dark'); 
  }
}

// ========== SEARCH FUNCTIONS ==========
function openSearch(){ 
  headerMenu.classList.remove('active'); 
  isSearchMode = true;
  searchBar.classList.add('active'); 
  inputBox.style.display = 'none';
  searchInput.value = '';
  searchResults = [];
  searchIndex = -1;
  searchCounter.textContent = '0 of 0';
  setTimeout(function(){ searchInput.focus(); }, 100);
}
function closeSearch(){ 
  isSearchMode = false;
  searchBar.classList.remove('active'); 
  inputBox.style.display = 'flex';
}
function doSearch(){
  var query = searchInput.value.trim().toLowerCase();
  if(!query){
    searchResults = [];
    searchIndex = -1;
    searchCounter.textContent = '0 of 0';
    highlightSearch(false);
    return;
  }
  searchResults = [];
  var messages = document.querySelectorAll('#messages .message-row');
  messages.forEach(function(row, idx){
    var text = row.querySelector('.text');
    if(text && text.innerText.toLowerCase().includes(query)){
      searchResults.push(idx);
    }
  });
  searchIndex = searchResults.length > 0 ? 0 : -1;
  searchCounter.textContent = (searchIndex + 1) + ' of ' + searchResults.length;
  highlightSearch(true);
  if(searchIndex >= 0){
    scrollToSearchResult(searchResults[searchIndex]);
  }
}
function highlightSearch(enable){
  var messages = document.querySelectorAll('#messages .message-row');
  messages.forEach(function(row, idx){
    var textDiv = row.querySelector('.text');
    if(textDiv){
      if(enable && searchResults.includes(idx)){
        textDiv.style.backgroundColor = 'rgba(0,132,255,0.2)';
        textDiv.style.borderRadius = '4px';
      } else {
        textDiv.style.backgroundColor = '';
      }
    }
  });
}
function scrollToSearchResult(index){
  var messages = document.querySelectorAll('#messages .message-row');
  if(messages[index]){
    messages[index].scrollIntoView({ behavior: 'smooth', block: 'center' });
    messages[index].style.transition = 'background 0.3s';
    messages[index].style.backgroundColor = 'var(--selection-bg)';
    setTimeout(function(){
      messages[index].style.backgroundColor = '';
    }, 2000);
  }
}
function searchPrev(){
  if(searchResults.length === 0) return;
  searchIndex--;
  if(searchIndex < 0) searchIndex = searchResults.length - 1;
  searchCounter.textContent = (searchIndex + 1) + ' of ' + searchResults.length;
  scrollToSearchResult(searchResults[searchIndex]);
}
function searchNext(){
  if(searchResults.length === 0) return;
  searchIndex++;
  if(searchIndex >= searchResults.length) searchIndex = 0;
  searchCounter.textContent = (searchIndex + 1) + ' of ' + searchResults.length;
  scrollToSearchResult(searchResults[searchIndex]);
}

// ========== FORWARD FUNCTIONS ==========
function loadForwardList() {
  fetch('/api/user_groups?username=' + encodeURIComponent(currentUsername))
    .then(function(r) { return r.json(); })
    .then(function(groups) {
      forwardList.innerHTML = '';
      groups.forEach(function(group) {
        var item = document.createElement('div');
        item.className = 'forward-item';
        item.setAttribute('data-chat', group.id);
        item.innerHTML = '<div class="forward-avatar">' + (group.avatar || '💬') + '</div><div class="forward-name">' + escapeHtml(group.name) + '</div>';
        item.onclick = function() { executeForward(group.id); };
        forwardList.appendChild(item);
      });
    });
}
function openForwardSheet(message){
  forwardTarget = message;
  loadForwardList();
  forwardOverlay.classList.add('active');
}
function closeForwardSheet(){ forwardOverlay.classList.remove('active'); forwardTarget = null; }
function executeForward(targetChat){
  var now = new Date();
  var time = now.getHours() + ":" + String(now.getMinutes()).padStart(2, "0");
  socket.emit('send_message', {
    username: currentUsername,
    text: forwardTarget.text ? `📎 Forwarded from Saved:\n${forwardTarget.text}` : '',
    time: time,
    file_url: forwardTarget.file_url || '',
    file_type: forwardTarget.file_type || '',
    file_name: forwardTarget.file_name || '',
    group_id: targetChat
  });
  showDynamicIsland("Forwarded");
  closeForwardSheet();
}

// ========== EDIT FUNCTIONS ==========
function openEditModal(message, index){
  editTarget = { message: message, index: index };
  editTextarea.value = message.text || '';
  editModalOverlay.classList.add('active');
}
function closeEditModal(){ editModalOverlay.classList.remove('active'); editTarget = null; }
function saveEditMessage(){
  if(!editTarget) return;
  var newText = editTextarea.value.trim();
  if(newText && newText !== editTarget.message.text){
    savedMessages[editTarget.index].text = newText;
    savedMessages[editTarget.index].edited = true;
    savedMessages[editTarget.index].edited_time = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    localStorage.setItem("saved_messages", JSON.stringify(savedMessages));
    loadMessages();
    showDynamicIsland("Message edited");
  }
  closeEditModal();
}

// ========== POPUP FUNCTIONS ==========
function showDynamicIsland(msg){ 
  islandText.textContent = msg; 
  dynamicIsland.classList.add('show'); 
  clearTimeout(islandTimer); 
  islandTimer = setTimeout(function(){ dynamicIsland.classList.remove('show'); }, 2000); 
}

function toggleHeaderMenu(e){ e.stopPropagation(); hideAllPopups(); headerMenu.classList.toggle('active'); }
function hideAllPopups(){ 
  msgActionPopup.classList.remove('active'); 
  headerMenu.classList.remove('active'); 
}

function msgActionReply(){
  hideAllPopups();
  if(tapTarget){
    replyTarget = tapTarget;
    var previewText = tapTarget.text || (tapTarget.file_type === 'image' ? '📷 Photo' : (tapTarget.file_type === 'video' ? '🎬 Video' : (tapTarget.file_type === 'voice' ? '🎤 Voice message' : '📎 File')));
    replyPreviewSender.textContent = "Replying";
    replyPreviewText.textContent = previewText.substring(0, 60);
    replyPreview.classList.add('active');
  }
}
function msgActionCopy(){
  hideAllPopups();
  if(tapTarget){
    var textToCopy = tapTarget.text || '';
    if(textToCopy){
      navigator.clipboard.writeText(textToCopy).then(function(){ showDynamicIsland("Copied to clipboard"); });
    }
  }
}
function msgActionSelect(){
  hideAllPopups();
  if(tapTarget) enterSelectionMode(tapTarget.index);
}
function msgActionForward(){
  hideAllPopups();
  if(tapTarget) openForwardSheet(tapTarget);
}
function msgActionEdit(){
  hideAllPopups();
  if(tapTarget) openEditModal(tapTarget, tapTarget.index);
}
function msgActionSave(){
  hideAllPopups();
  if(tapTarget && tapTarget.file_url){
    var a = document.createElement('a');
    a.href = tapTarget.file_url;
    a.download = 'media_' + Date.now();
    a.click();
    showDynamicIsland("Saved to gallery");
  }
}
function cancelReply(){ replyTarget=null; replyPreview.classList.remove('active'); }

// ========== SELECTION FUNCTIONS ==========
function showDeleteModal(){
  if(selectedMessages.size === 0) return;
  deleteModalOverlay.classList.add('active');
}
function closeDeleteModal(){ deleteModalOverlay.classList.remove('active'); }

btnDeleteConfirm.onclick = function(){
  var idx = Array.from(selectedMessages).sort(function(a,b){return b-a});
  idx.forEach(function(i){ savedMessages.splice(i,1); });
  localStorage.setItem("saved_messages", JSON.stringify(savedMessages));
  closeDeleteModal();
  cancelSelection();
  loadMessages();
};

function enterSelectionMode(i){ 
  isSelectionMode=true; 
  document.body.classList.add('selection-mode'); 
  normalHeader.classList.add('hidden'); 
  selectionHeader.classList.add('active'); 
  selectedMessages.clear(); 
  if(i!==undefined&&i>=0){ selectedMessages.add(i); }
  updateSelectionUI(); 
  renderAllMessages(); 
}
function cancelSelection(){ 
  isSelectionMode=false; 
  selectedMessages.clear(); 
  document.body.classList.remove('selection-mode'); 
  normalHeader.classList.remove('hidden'); 
  selectionHeader.classList.remove('active'); 
  renderAllMessages(); 
}
function updateSelectionUI(){ selectionCount.textContent=selectedMessages.size+' selected'; }

// ========== HELPER FUNCTIONS ==========
function escapeHtml(text) {
  if(!text) return '';
  var div = document.createElement('div');
  div.innerText = text;
  return div.innerHTML;
}

function formatSize(bytes){ if(bytes<1024) return bytes+' B'; if(bytes<1048576) return (bytes/1024).toFixed(1)+' KB'; return (bytes/1048576).toFixed(1)+' MB'; }
function getFileIcon(name){ var e=name.split('.').pop().toLowerCase(); return e==='pdf'?'PDF':e==='zip'||e==='rar'?'ZIP':'FILE'; }
function getDoubleTick(){ return '<svg viewBox="0 0 20 16" style="fill:#4caf50"><path d="M2 8l3 3 5-6" fill="none" stroke="#4caf50" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 8l3 3 5-6" fill="none" stroke="#4caf50" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }
function formatVoiceDuration(sec){ var m=Math.floor(sec/60), s=sec%60; return m+':'+String(s).padStart(2,'0'); }

function getColorClass(n){ var h=0; for(var i=0;i<n.length;i++) h=n.charCodeAt(i)+((h<<5)-h); return 'c'+(Math.abs(h)%8); }
function getInitial(n){ return n.charAt(0).toUpperCase(); }

function getMicIcon(){ return '<svg class="mic-icon" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>'; }
function getSendIcon(){ return '<svg class="send-icon" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>'; }

function updateSendButton(){
  if(textarea.value.trim().length>0){ sendBtn.innerHTML=getSendIcon(); sendBtn.className='send-btn send'; }
  else { sendBtn.innerHTML=getMicIcon(); sendBtn.className='send-btn mic'; }
}

// ========== VOICE RECORDING ==========
var voicePressTimer;
sendBtn.addEventListener('pointerdown',function(e){
  if(textarea.value.trim().length>0){ e.preventDefault(); send(); return; }
  e.preventDefault(); voicePressTimer=setTimeout(function(){ startRecording(); },200);
});
sendBtn.addEventListener('pointerup',function(){ clearTimeout(voicePressTimer); });
sendBtn.addEventListener('pointerleave',function(){ clearTimeout(voicePressTimer); });

async function startRecording(){
  if(isRecording) return;
  try{
    voiceStream=await navigator.mediaDevices.getUserMedia({audio:true});
    mediaRecorder=new MediaRecorder(voiceStream); audioChunks=[];
    mediaRecorder.ondataavailable=function(e){ if(e.data.size>0) audioChunks.push(e.data); };
    mediaRecorder.onstop=async function(){
      if(voiceStream){ voiceStream.getTracks().forEach(function(t){ t.stop(); }); voiceStream=null; }
      if(audioChunks.length===0) return;
      var blob=new Blob(audioChunks,{type:'audio/webm'});
      var formData=new FormData(); formData.append('file',blob,'voice_'+Date.now()+'.webm');
      var res=await fetch('/upload',{method:'POST',body:formData});
      var data=await res.json();
      if(data.ok){
        var now=new Date(), time=now.getHours()+":"+String(now.getMinutes()).padStart(2,"0");
        savedMessages.push({
          text:'',
          time:time,
          file_url:data.url,
          file_type:'voice',
          duration:Math.round((Date.now()-voiceStartTime)/1000),
          username: currentUsername,
          display_name: getDisplayName(currentUsername)
        });
        localStorage.setItem("saved_messages",JSON.stringify(savedMessages));
        loadMessages();
      }
    };
    mediaRecorder.start(); isRecording=true; voiceStartTime=Date.now();
    voiceOverlay.classList.add('active'); voiceTimer.textContent='0:00';
    voiceTimerInterval=setInterval(function(){ var e=Math.floor((Date.now()-voiceStartTime)/1000); voiceTimer.textContent=Math.floor(e/60)+':'+String(e%60).padStart(2,'0'); },200);
  }catch(e){ alert('Microphone access denied'); }
}
function stopRecording(){ if(!mediaRecorder||mediaRecorder.state==='inactive') return; isRecording=false; voiceOverlay.classList.remove('active'); clearInterval(voiceTimerInterval); mediaRecorder.stop(); }
function cancelRecording(){ if(!mediaRecorder||mediaRecorder.state==='inactive') return; isRecording=false; voiceOverlay.classList.remove('active'); clearInterval(voiceTimerInterval); audioChunks=[]; if(voiceStream){ voiceStream.getTracks().forEach(function(t){ t.stop(); }); voiceStream=null; } mediaRecorder.onstop=function(){}; mediaRecorder.stop(); }

// ========== UPLOAD FUNCTIONS ==========
function openUploadSheet(){ fileInput.click(); }
fileInput.onchange=function(){ selectedFiles=Array.from(fileInput.files); renderUploadGrid(); uploadOverlay.classList.add('active'); fileInput.value=''; };
function closeUploadSheet(){ uploadOverlay.classList.remove('active'); selectedFiles=[]; renderUploadGrid(); }

function renderUploadGrid(){
  uploadGrid.innerHTML='';
  if(selectedFiles.length===0) uploadGrid.innerHTML='<div style="text-align:center;padding:40px;color:var(--text-secondary);grid-column:1/-1">No files selected</div>';
  else selectedFiles.forEach(function(f,i){
    var item=document.createElement('div'); item.className='upload-item'; item.onclick=function(){ toggleFileSelect(i,item); };
    var url=URL.createObjectURL(f);
    if(f.type.startsWith('image/')) item.innerHTML='<img src="'+url+'" /><div class="upload-select-circle"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg></div>';
    else if(f.type.startsWith('video/')) item.innerHTML='<video src="'+url+'"></video><div class="upload-select-circle"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg></div>';
    else item.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:40px;color:white">'+getFileIcon(f.name)+'</div><div class="upload-select-circle"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg></div>';
    uploadGrid.appendChild(item);
  });
  updateUploadUI();
}
function toggleFileSelect(i,item){ item.classList.toggle('selected'); updateUploadUI(); }
function updateUploadUI(){ var c=uploadGrid.querySelectorAll('.upload-item.selected').length; uploadCountEl.textContent=c+' selected'; uploadSendBtn.disabled=c===0; }

async function sendFiles(){
  var items=uploadGrid.querySelectorAll('.upload-item.selected'); if(items.length===0) return;
  var now=new Date(), time=now.getHours()+":"+String(now.getMinutes()).padStart(2,"0");
  uploadSendBtn.disabled=true; uploadSendBtn.textContent='Sending...';
  for(var i=0;i<items.length;i++){
    var item=items[i]; var file=selectedFiles[Array.from(uploadGrid.children).indexOf(item)];
    var fd=new FormData(); fd.append('file',file);
    var res=await fetch('/upload',{method:'POST',body:fd});
    var data=await res.json();
    if(data.ok){
      savedMessages.push({
        text:'',
        time:time,
        file_url:data.url,
        file_type:data.type,
        file_size:file.size,
        file_name:file.name,
        username: currentUsername,
        display_name: getDisplayName(currentUsername)
      });
      localStorage.setItem("saved_messages",JSON.stringify(savedMessages));
    }
  }
  closeUploadSheet(); loadMessages();
}

// ========== CORE FUNCTIONS ==========
function loadMessages(){ 
  savedMessages=JSON.parse(localStorage.getItem("saved_messages")||"[]"); 
  renderAllMessages(); 
}

function renderAllMessages(){
  messagesDiv.innerHTML="";
  msgCount.textContent = savedMessages.length + ' messages';
  if(savedMessages.length===0 && !isSelectionMode){
    messagesDiv.innerHTML = '<div style="text-align:center;color:var(--text-secondary);padding:40px 20px;font-size:14px;">No saved messages<br><span style="font-size:12px;opacity:0.6;">Forward messages here to save them</span></div>';
    return;
  }
  
  savedMessages.forEach(function(m, index){
    var row = document.createElement("div");
    row.className = "message-row self";
    if(selectedMessages.has(index)) row.classList.add("selected");
    row.dataset.index = index;
    
    var circleHTML = '<div class="select-circle"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg></div>';
    
    // ====== استفاده از display_name برای آواتار ======
    var msgUsername = m.username || currentUsername;
    var msgDisplayName = m.display_name || getDisplayName(msgUsername);
    var initial = msgDisplayName.charAt(0).toUpperCase();
    var colorClass = getColorClass(msgUsername);
    
    var avatarHTML = '<div class="msg-avatar ' + colorClass + '">' + initial + '</div>';
    
    var replyHtml = '';
    if(m.reply_info){
      replyHtml = `<div class="message-reply"><svg viewBox="0 0 24 24" width="12" height="12"><path d="M10 9V5l-7 7 7 7v-4.1c5 0 8.5 1.6 11 5.1-1-5-4-10-11-11z" fill="currentColor"/></svg><span style="color:#0084ff;">${escapeHtml(m.reply_info.username)}</span><span style="color:var(--text-secondary);">${escapeHtml(m.reply_info.text)}</span></div>`;
    }
    
    var contentHTML = '';
    if(m.file_url){
      if(m.file_type==='image') contentHTML+='<img src="'+m.file_url+'" class="media-in-message" onclick="window.open(\''+m.file_url+'\')" />';
      else if(m.file_type==='video') contentHTML+='<video src="'+m.file_url+'" class="media-in-message" controls preload="metadata" style="max-width:260px;max-height:280px;border-radius:8px;"></video>';
      else if(m.file_type==='voice') contentHTML+='<div class="voice-in-message"><button class="voice-play-btn" onclick="playVoice(event,\''+m.file_url+'\',this)">▶</button><span class="voice-duration">'+formatVoiceDuration(m.duration||0)+'</span></div>';
      else contentHTML+='<div class="file-card" onclick="downloadFile(\''+m.file_url+'\',\''+(m.file_name||'file')+'\')"><div class="file-icon">'+getFileIcon(m.file_name||'file')+'</div><div class="file-info"><div class="file-name">'+(m.file_name||'File')+'</div><div class="file-size">'+(m.file_size?formatSize(m.file_size):'')+'</div></div></div>';
    }
    if(m.text) contentHTML+='<div class="text">'+escapeHtml(m.text)+'</div>';
    
    var editedHTML = '';
    if(m.edited){ editedHTML = '<span class="edited-label">ویرایش شده</span>'; }
    
    // ====== نمایش display_name در نام ======
    var nameHTML = '<div class="name">' + escapeHtml(msgDisplayName) + '</div>';
    
    var timeHTML = '<div class="time-row"><span class="time">'+escapeHtml(m.time)+'</span>'+editedHTML+'<span class="ticks">'+getDoubleTick()+'</span></div>';
    
    var messageHTML = '<div class="message">' + nameHTML + replyHtml + contentHTML + timeHTML + '</div>';
    
    row.innerHTML = circleHTML + avatarHTML + messageHTML;
    
    row.onclick = (function(msg, idx) {
      return function(e) {
        e.stopPropagation();
        if(isSelectionMode){ 
          if(selectedMessages.has(idx)){
            selectedMessages.delete(idx);
            this.classList.remove('selected');
          } else {
            selectedMessages.add(idx);
            this.classList.add('selected');
          }
          updateSelectionUI(); 
          return; 
        }
        hideAllPopups();
        tapTarget = msg;
        tapTarget.index = idx;
        msgActionSave.style.display = (msg.file_url && (msg.file_type==='image'||msg.file_type==='video')) ? 'flex' : 'none';
        var rect = this.getBoundingClientRect();
        msgActionPopup.style.left = Math.min(rect.left, window.innerWidth-190) + 'px';
        msgActionPopup.style.top = Math.min(rect.bottom + 4, window.innerHeight-200) + 'px';
        msgActionPopup.classList.add('active');
      };
    })(m, index);
    
    messagesDiv.appendChild(row);
  });
  
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
  if(isSearchMode && searchInput.value.trim()){
    doSearch();
  }
}

function playVoice(e,url,btn){ e.stopPropagation(); var a=new Audio(url); a.play(); btn.textContent='⏸'; a.onended=function(){btn.textContent='▶';}; }
function downloadFile(url,name){ var a=document.createElement('a'); a.href=url; a.download=name; a.click(); }

function send(){
  var text=textarea.value.trim(); if(text==="") return;
  var now=new Date(), time=now.getHours()+":"+String(now.getMinutes()).padStart(2,"0");
  var msgData = {
    text:text, 
    time:time,
    username: currentUsername,
    display_name: getDisplayName(currentUsername)
  };
  if(replyTarget){ 
    msgData.reply_to = replyTarget.id;
    msgData.reply_info = {username: "You", text: (replyTarget.text || '[Media]').substring(0, 50)};
    cancelReply();
  }
  savedMessages.push(msgData);
  localStorage.setItem("saved_messages",JSON.stringify(savedMessages));
  textarea.value=""; textarea.style.height='auto'; updateSendButton(); loadMessages();
  showDynamicIsland("Message saved");
}

function goBack(){ location.replace("/rooms"); }

// ========== SOCKET.IO ==========
var socket = io();

socket.on('receive_message', function(data) {
  if(data.group_id === 'saved') {
    savedMessages.push(data);
    localStorage.setItem("saved_messages", JSON.stringify(savedMessages));
    loadMessages();
  }
});

// ========== EVENT LISTENERS ==========
textarea.addEventListener('input',function(){ 
  this.style.height='auto'; 
  this.style.height=Math.min(this.scrollHeight,120)+'px'; 
  updateSendButton(); 
});

textarea.addEventListener('keypress',function(e){ 
  if(e.key==="Enter"&&!e.shiftKey){ 
    e.preventDefault(); 
    send(); 
  } 
});

document.addEventListener('click',function(e){ 
  if(!e.target.closest('.msg-action-popup')&&!e.target.closest('.header-menu')&&!e.target.closest('.edit-modal-overlay')){ 
    hideAllPopups(); 
  } 
});

uploadOverlay.onclick=function(e){ if(e.target===uploadOverlay) closeUploadSheet(); };
window.addEventListener('storage',function(e){ 
  if(e.key==='theme') document.documentElement.classList.toggle('dark-mode',localStorage.getItem('theme')==='dark'); 
  if(e.key==='saved_messages') loadMessages(); 
});

// ========== INIT ==========
if(localStorage.getItem('theme')==='dark') document.documentElement.classList.add('dark-mode');
loadMessages();
</script>
